<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112" width="112" height="112" role="img" aria-label="카마도 탄지로 스타일 프로필 일러스트">
  <defs>
    <pattern id="ichimatsu" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="28" height="28" fill="#12261b"/>
      <rect width="14" height="14" fill="#2f7d4f"/>
      <rect x="14" y="14" width="14" height="14" fill="#2f7d4f"/>
    </pattern>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d1013"/>
      <stop offset="55%" stop-color="#5d1a16"/>
      <stop offset="100%" stop-color="#9c3a1e"/>
