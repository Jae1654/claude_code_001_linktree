      <rect x="24" y="63" width="9" height="13" rx="1.5" fill="#f7f3e8"/>
      <circle cx="28.5" cy="68" r="2.6" fill="#d1372c"/>
      <path d="M28.5 71v5M25.5 72l6 3M31.5 72l-6 3" stroke="#d1372c" stroke-width="1.2"/>
