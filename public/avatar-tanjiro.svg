    <path d="M56 14c-9 0-17 5-22 14 7-3 12-8 15-14 4 7 11 12 19 14-3-8-6-14-12-14z" fill="#3d1013"/>
    <path d="M84 30l8-12-3 15zM28 30l-8-12 3 15z" fill="#9c3a1e"/>

