    <path d="M56 62v4" stroke="#d99a72" stroke-width="2" stroke-linecap="round"/>
    <path d="M50 71c4 3 8 3 12 0" stroke="#b5654a" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- 화투 귀걸이 -->
