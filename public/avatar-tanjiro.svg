    <path d="M44 34l5 6-3 5 6-3" fill="none" stroke="#b03f22" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 눈썹 -->
    <path d="M40 48h12M60 48h12" stroke="#3d1013" stroke-width="3" stroke-linecap="round"/>

    <!-- 눈 -->
    <ellipse cx="46" cy="56" rx="6" ry="7" fill="#ffffff"/>
    <ellipse cx="66" cy="56" rx="6" ry="7" fill="#ffffff"/>
    <circle cx="46" cy="56" r="4" fill="#7a2f1a"/>
    <circle cx="66" cy="56" r="4" fill="#7a2f1a"/>
    <circle cx="47.5" cy="54.5" r="1.4" fill="#ffffff"/>
    <circle cx="67.5" cy="54.5" r="1.4" fill="#ffffff"/>

