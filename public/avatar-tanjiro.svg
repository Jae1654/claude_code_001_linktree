    <ellipse cx="83" cy="56" rx="5" ry="7" fill="#e8b48c"/>

    <!-- 얼굴 -->
    <path d="M32 46c0-16 10-26 24-26s24 10 24 26c0 20-11 34-24 34S32 66 32 46z" fill="#f2c6a0"/>

